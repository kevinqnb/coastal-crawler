id: 2026-10-20-repr-modernbert-full-01
project: coastal-crawler
description: >
  Rung 4 full run: all eligible papers in table_clean_done/processing/extracted/failed. Submit only after smoke, tiny and the determinism twin match their predictions. answerdotai/ModernBERT-large (bidirectional, bf16, sdpa), mean pooling over each term match, paragraph window context_radius=1, layers 24 and 28 (28 = post-final-norm), cleaning on (tables, page tags, references with a 0.5 kept-fraction guard). Papers whose text cleaning raises (unclosed <table>) or that have a window over 8192 tokens are EXCLUDED at seed time and listed with reasons in artifacts/repr_skipped.json; reference-contaminated papers are kept (reference_heading_found is stored per paper in the shard and index).
seed: 342
params:
  stage: repr
  terms_file: configs/repr-terms/coastal-terms-01.txt
  source_statuses: [table_clean_done, processing, extracted, failed]
  max_papers: null
  batch_size: 8
  skip_overflow: true
  skip_clean_errors: true
  env:
    REPR_LM_MODEL: answerdotai/ModernBERT-large
    REPR_LM_ARCHITECTURE: bidirectional
    REPR_LM_POOLING: mean
    REPR_LM_CONTEXT_RADIUS: "1"
    REPR_LM_LAYERS: "24,28"
    REPR_LM_DEVICE: cuda:0
    REPR_LM_DTYPE: bfloat16
    REPR_LM_ATTN_IMPLEMENTATION: sdpa
    REPR_LM_HF_CACHE_DIR: /projectnb/mcnet/kevin/cache-hf
    REPR_LM_REMOVE_REFERENCES: "true"
    REPR_LM_REMOVE_TABLES: "true"
    REPR_LM_REMOVE_PAGE_TAGS: "true"
    REPR_LM_MIN_KEPT_FRACTION: "0.5"
    REPR_LM_STORE_DTYPE: float32
    REPR_LM_TEXT_DIR: data/table_clean
    HF_HUB_OFFLINE: "1"
