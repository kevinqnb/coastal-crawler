[project]
name = "coastal-crawler"
version = "0.1.0"
description = "Discovery and extraction pipeline for coastal-ecosystem papers"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alembic>=1.13",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.7",
    "nh3>=0.2",
    "openai>=1.0",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scholarlm",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[tool.uv.sources]
# Pinned to a full commit SHA (not a floating branch ref) for reproducibility;
# `advances` is recorded here only as provenance for where that commit lives.
# See notes/coastal-crawler/builds/2026-08-18-scholarlm-migration-01.md.
scholarlm = { git = "https://github.com/kevinqnb/scholarlm.git", rev = "d9579cc0b11bda05925cc58a99c325fc7f8a1b79" }  # branch: advances

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
coastal-crawler = "coastal_crawler.cli:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
