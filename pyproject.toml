[project]
name = "coastal-crawler"
version = "0.1.0"
description = "Discovery and extraction pipeline for coastal-ecosystem papers"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alembic>=1.13",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.7",
    "nh3>=0.2",
    # Pinned to exactly what scholarlm's own [gpu] extra specifies (see
    # notes/coastal-crawler/builds/2026-08-18-judgement-attribution-01.md) —
    # added directly rather than depending on scholarlm[gpu] itself, which
    # also pulls in olmocr/gliner2 and ~30 unrelated transitive packages
    # (boto3, google-cloud-storage, socketio, ...) not needed by
    # JudgementLM/attribution.py.
    "nnsight==0.5.11",
    "nnterp>=1.2.1",
    "openai>=1.0",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scholarlm",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    # Was transitive-only (via scholarlm) until the extraction-hardening
    # truncation backstop needed AutoTokenizer directly — see
    # notes/coastal-crawler/builds/2026-08-20-extraction-hardening-01.md.
    "transformers>=4.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[tool.uv.sources]
# Pinned to a full commit SHA (not a floating branch ref) for reproducibility;
# `advances` is recorded here only as provenance for where that commit lives.
# See notes/coastal-crawler/builds/2026-08-18-scholarlm-migration-01.md and
# notes/coastal-crawler/builds/2026-08-20-extraction-hardening-01.md (pin
# bump to pick up drop_references/context_length_exceeded_docs).
scholarlm = { git = "https://github.com/kevinqnb/scholarlm.git", rev = "f928caef5accc40d96f2fa172cdec98d88cb1dec" }  # branch: advances

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
coastal-crawler = "coastal_crawler.cli:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
